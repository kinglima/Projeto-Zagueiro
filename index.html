<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HUB TITAN">
<meta name="theme-color" content="#000000">
<title>HUB TITAN</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
<style>
/* ── RESET & ROOT ── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#000;--s1:#0a0a0a;--s2:#0f0f0f;--s3:#141414;--border:#1a1a1a;--border2:#222;
  --gold:#f0c040;--orange:#FF6B35;--blue:#4da8f0;--green:#3dcc84;--purple:#9b7fe8;--red:#e04545;
  --gold-d:#a08020;--blue-d:#3a7ab0;--green-d:#2a8a60;--purple-d:#7a60b0;--red-d:#a03030;
  --text:#e8ecf4;--muted:#6a7090;--muted2:#3a3a4a;
  --f-xs:10px;--f-sm:11px;--f-md:13px;--f-lg:15px;--f-xl:18px;
  --r:10px;--r-sm:8px;--nav:56px;--safe:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,44px);
}
html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;}
.app{background:var(--bg);}
/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;height:100%;height:100dvh;}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.content::-webkit-scrollbar{display:none;}
.page{display:none;flex-direction:column;padding:calc(var(--safe-top)+14px) 14px calc(var(--nav)+var(--safe)+12px);}
.page.active{display:flex;}
/* ── NAV ── */
.nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav)+var(--safe));background:rgba(0,0,0,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:8px;z-index:100;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;padding:0;}
.nb i{font-size:22px;color:var(--muted2);transition:color .2s;}
.nb span{font-size:var(--f-xs);font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em;transition:color .2s;}
.nb.active i,.nb.active span{color:var(--orange);}
/* ── HEADER ── */
.hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
.hdr-title{font-size:var(--f-xl);font-weight:800;letter-spacing:-.3px;line-height:1;}
.hub{color:var(--gold);}.titan{color:var(--orange);}
.hdr-r{font-size:var(--f-xs);color:var(--muted2);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
/* ── RINGS ── */
.rings{display:flex;justify-content:space-between;margin-bottom:14px;padding:0 4px;}
.rw{display:flex;flex-direction:column;align-items:center;gap:3px;}
.rl{font-size:var(--f-xs);color:var(--muted2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.rn{font-size:11px;font-weight:700;fill:#fff;dominant-baseline:middle;text-anchor:middle;}
/* ── CARDS 3-COL ── */
.c3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px;}
.card{background:var(--s2);border-radius:var(--r);padding:10px 8px;height:68px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;}
.card i{font-size:16px;}
.cv{font-size:var(--f-md);font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;}
.cl{font-size:var(--f-xs);color:var(--muted2);}
/* ── SEC ── */
.sec{font-size:var(--f-xs);font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
/* ── TASKS ── */
.tasks{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
.task{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:var(--r);padding:10px 12px;min-height:40px;cursor:pointer;}
.tcb{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.tcb.done{background:var(--green);border-color:var(--green);}
.tcb.done::after{content:'';width:5px;height:9px;border:2px solid #000;border-top:none;border-left:none;transform:rotate(45deg);margin-top:-2px;}
.ttx{font-size:var(--f-md);color:var(--muted);flex:1;}
.ttx.done{text-decoration:line-through;color:var(--muted2);}
.ttag{font-size:var(--f-xs);font-weight:700;padding:2px 6px;border-radius:4px;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em;}
.tw{background:rgba(77,168,240,.1);color:var(--blue-d);}
.tc{background:rgba(155,127,232,.1);color:var(--purple-d);}
.ts{background:rgba(61,204,132,.1);color:var(--green-d);}
.tf{background:rgba(240,192,64,.1);color:var(--gold-d);}
.tr{background:rgba(224,69,69,.1);color:var(--red-d);}
/* ── WATER ── */
.wbar{background:var(--s2);border-radius:var(--r);padding:12px;margin-bottom:14px;}
.wh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.wt{font-size:var(--f-xs);font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.07em;}
.wv{font-size:var(--f-sm);font-weight:700;color:var(--blue);}
.wtr{height:4px;background:var(--s3);border-radius:2px;overflow:hidden;margin-bottom:8px;}
.wf{height:100%;border-radius:2px;background:var(--blue);transition:width .4s;}
.wsubs{display:flex;gap:5px;}
.ws{flex:1;background:var(--s3);border-radius:6px;padding:6px;text-align:center;cursor:pointer;}
.wsn{font-size:var(--f-sm);font-weight:700;color:var(--blue);display:block;}
.wsl{font-size:var(--f-xs);color:var(--muted2);}
/* ── STABS ── */
.stabs{display:flex;gap:5px;margin-bottom:14px;}
.stab{padding:5px 10px;border-radius:14px;font-size:var(--f-xs);font-weight:700;color:var(--muted2);border:1px solid var(--border);background:transparent;cursor:pointer;white-space:nowrap;transition:all .2s;}
.stab.active{color:var(--orange);border-color:rgba(255,107,53,.3);background:rgba(255,107,53,.08);}
/* ── EX LIST ── */
.exs{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
.ex{display:flex;align-items:flex-start;gap:8px;background:var(--s2);border-radius:var(--r);padding:10px 12px;cursor:pointer;}
.ecb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.ecb.done{background:var(--green);border-color:var(--green);}
.ecb.done::after{content:'';width:4px;height:7px;border:1.5px solid #000;border-top:none;border-left:none;transform:rotate(45deg);margin-top:-1px;}
.exn{font-size:var(--f-md);color:var(--muted);}
.exs2{font-size:var(--f-xs);color:var(--muted2);margin-top:2px;}
.exn.done{text-decoration:line-through;color:var(--muted2);}
/* ── PROG BARS ── */
.prows{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
.prow{display:flex;align-items:center;gap:8px;}
.plbl{font-size:var(--f-xs);color:var(--muted2);width:60px;flex-shrink:0;}
.ptr{flex:1;height:3px;background:var(--s3);border-radius:2px;overflow:hidden;}
.pfl{height:100%;border-radius:2px;}
.pv{font-size:var(--f-xs);font-weight:700;color:var(--muted);width:24px;text-align:right;flex-shrink:0;}
/* ── HOUSE ROWS ── */
.hrows{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
.hrow{background:var(--s2);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;gap:10px;}
.hric{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hric i{font-size:16px;}
.hrnm{font-size:var(--f-md);font-weight:600;color:var(--muted);}
.hrvl{font-size:var(--f-xs);color:var(--muted2);margin-top:2px;}
.hrst{font-size:var(--f-md);font-weight:700;flex-shrink:0;}
/* ── ADD BUTTON ── */
.add-btn{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--s2);border-radius:var(--r);padding:12px;font-size:var(--f-sm);font-weight:700;color:var(--muted2);margin-bottom:14px;border:1px dashed var(--border2);cursor:pointer;}
.add-btn i{font-size:16px;}
/* ── INPUT AREA ── */
.input-area{background:var(--s2);border-radius:var(--r);padding:12px;margin-bottom:14px;}
.input-lbl{font-size:var(--f-xs);font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;}
.fi{width:100%;background:var(--s3);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;font-size:var(--f-md);color:var(--text);outline:none;-webkit-appearance:none;margin-bottom:8px;}
.fi::placeholder{color:var(--muted2);}
.fi:focus{border-color:var(--orange);}
select.fi{cursor:pointer;}
.irow{display:flex;gap:6px;}
.irow .fi{margin-bottom:0;}
.ibtn{background:var(--orange);border:none;border-radius:var(--r-sm);padding:10px 16px;font-size:var(--f-sm);font-weight:700;color:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0;}
/* ── ALERT ── */
.alert-b{display:flex;align-items:center;gap:6px;background:rgba(240,192,64,.07);border:1px solid rgba(240,192,64,.2);border-radius:var(--r-sm);padding:8px 12px;font-size:var(--f-xs);font-weight:700;color:var(--gold-d);margin-bottom:14px;}
.alert-b i{font-size:14px;}
.alert-r{display:flex;align-items:center;gap:6px;background:rgba(224,69,69,.07);border:1px solid rgba(224,69,69,.2);border-radius:var(--r-sm);padding:8px 12px;font-size:var(--f-xs);font-weight:700;color:var(--red-d);margin-bottom:14px;}
/* ── MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;}
.modal-bg.open{display:flex;}
.modal{background:#111;border-radius:20px 20px 0 0;padding:20px 16px calc(var(--safe)+20px);width:100%;}
.modal-title{font-size:var(--f-lg);font-weight:700;color:var(--text);margin-bottom:14px;}
.modal-close{float:right;background:var(--s2);border:none;border-radius:50%;width:28px;height:28px;font-size:16px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;}
/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--nav)+var(--safe)+10px);left:14px;right:14px;background:#1a1a2e;border:1px solid var(--border2);border-radius:12px;padding:12px 16px;font-size:var(--f-md);color:var(--text);transform:translateY(8px);opacity:0;transition:all .25s;z-index:300;pointer-events:none;display:flex;align-items:center;gap:8px;}
.toast.show{transform:translateY(0);opacity:1;}
/* ── EMPTY ── */
.empty{text-align:center;padding:32px 16px;color:var(--muted2);font-size:var(--f-md);}
/* ── INFO BANNER ── */
.info-b{background:rgba(77,168,240,.06);border:1px solid rgba(77,168,240,.15);border-radius:var(--r-sm);padding:10px 12px;font-size:var(--f-sm);color:var(--muted);line-height:1.6;margin-bottom:14px;}
</style>
</head>
<body>
<div class="app">
  <div class="content" id="content">
    <!-- HOJE -->
    <div class="page active" id="page-hoje"></div>
    <!-- FÍSICO -->
    <div class="page" id="page-fisico"></div>
    <!-- CASA -->
    <div class="page" id="page-casa"></div>
    <!-- CARRO -->
    <div class="page" id="page-carro"></div>
    <!-- TASKS -->
    <div class="page" id="page-tasks"></div>
  </div>

  <nav class="nav">
    <button class="nb active" onclick="goTo('hoje')" id="nb-hoje"><i class="ti ti-layout-dashboard"></i><span>Hoje</span></button>
    <button class="nb" onclick="goTo('fisico')" id="nb-fisico"><i class="ti ti-run"></i><span>Físico</span></button>
    <button class="nb" onclick="goTo('casa')" id="nb-casa"><i class="ti ti-home"></i><span>Casa</span></button>
    <button class="nb" onclick="goTo('carro')" id="nb-carro"><i class="ti ti-car"></i><span>Carro</span></button>
    <button class="nb" onclick="goTo('tasks')" id="nb-tasks"><i class="ti ti-check"></i><span>Tasks</span></button>
  </nav>
</div>

<!-- MODAL ADD TASK -->
<div class="modal-bg" id="modal-task">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('task')"><i class="ti ti-x"></i></button>
    <div class="modal-title">Nova tarefa</div>
    <input class="fi" id="task-desc" placeholder="Descrição da tarefa...">
    <div class="irow" style="margin-bottom:8px;">
      <select class="fi" id="task-cat">
        <option value="work">Trabalho</option>
        <option value="casa">Casa</option>
        <option value="pessoal">Pessoal</option>
        <option value="saude">Saúde</option>
        <option value="carro">Carro</option>
      </select>
      <input type="date" class="fi" id="task-date">
    </div>
    <button class="ibtn" style="width:100%;padding:13px;" onclick="saveTask()">Adicionar</button>
  </div>
</div>

<!-- MODAL ADD MANUT -->
<div class="modal-bg" id="modal-manut">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('manut')"><i class="ti ti-x"></i></button>
    <div class="modal-title">Registrar manutenção</div>
    <input class="fi" id="manut-desc" placeholder="Ex: Troca de óleo, paralama...">
    <div class="irow" style="margin-bottom:8px;">
      <input type="number" class="fi" id="manut-km" placeholder="Km atual">
      <input type="date" class="fi" id="manut-date">
    </div>
    <input class="fi" id="manut-note" placeholder="Observação (opcional)">
    <button class="ibtn" style="width:100%;padding:13px;margin-top:8px;" onclick="saveManut()">Salvar</button>
  </div>
</div>

<!-- MODAL AGUA PERIODO -->
<div class="modal-bg" id="modal-agua">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('agua')"><i class="ti ti-x"></i></button>
    <div class="modal-title" id="agua-modal-title">Registrar água</div>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <button class="ibtn" style="flex:1;background:var(--s3);color:var(--text);" onclick="addAgua(250)">+250ml</button>
      <button class="ibtn" style="flex:1;background:var(--s3);color:var(--text);" onclick="addAgua(500)">+500ml</button>
      <button class="ibtn" style="flex:1;" onclick="addAgua(1000)">+1L</button>
    </div>
    <input type="number" class="fi" id="agua-custom" placeholder="Quantidade em ml">
    <button class="ibtn" style="width:100%;padding:13px;" onclick="addAguaCustom()">Adicionar</button>
  </div>
</div>

<!-- MODAL CASA ADD -->
<div class="modal-bg" id="modal-casa">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('casa')"><i class="ti ti-x"></i></button>
    <div class="modal-title">Registrar</div>
    <select class="fi" id="casa-tipo">
      <option value="tarefa">Tarefa da casa</option>
      <option value="leitura-agua">Leitura hidrômetro</option>
      <option value="leitura-energia">Leitura energia</option>
    </select>
    <input class="fi" id="casa-desc" placeholder="Descrição...">
    <input type="date" class="fi" id="casa-date">
    <button class="ibtn" style="width:100%;padding:13px;" onclick="saveCasa()">Salvar</button>
  </div>
</div>

<div class="toast" id="toast"><span id="ti"></span><span id="tm"></span></div>

<script>
// ── STATE ──
const KEY='hub_titan_v1';
const DEF={
  checks:{},tasks:[],manut:[],casaTasks:[],
  agua:{manha:0,tarde:0,noite:0,date:''},
  fisioPhase:0,fisioLog:[],boxeLog:[],
  injStatus:'ok',pain:{},
  histMensal:[],histAgua:[],aguaLeituras:[],
  fisicaSub:'academia',casaSub:'visao',
};
let S=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(DEF));
['checks','tasks','manut','casaTasks','fisioLog','boxeLog','pain'].forEach(k=>{if(!S[k])S[k]=DEF[k]||{};});
if(!S.agua)S.agua={manha:0,tarde:0,noite:0,date:''};

// Pre-load historical data if empty
if(!S.histMensal||!S.histMensal.length)S.histMensal=[
  {id:"1",ref:"AGO/2025",kwh:388,dias:32,conta:404.6,note:""},
  {id:"2",ref:"SET/2025",kwh:369,dias:29,conta:412.44,note:""},
  {id:"3",ref:"OUT/2025",kwh:429,dias:30,conta:445.34,note:""},
  {id:"4",ref:"NOV/2025",kwh:484,dias:29,conta:511.5,note:""},
  {id:"5",ref:"DEZ/2025",kwh:686,dias:31,conta:709.26,note:"fatura negociada"},
  {id:"6",ref:"JAN/2026",kwh:938,dias:32,conta:934.24,note:"fatura negociada"},
  {id:"7",ref:"FEV/2026",kwh:432,dias:29,conta:423.82,note:""},
  {id:"8",ref:"MAR/2026",kwh:445,dias:31,conta:431.2,note:"inclui parcelamento"},
  {id:"9",ref:"ABR/2026",kwh:408,dias:30,conta:396.45,note:"inclui parcelamento"},
  {id:"10",ref:"MAI/2026",kwh:450,dias:32,conta:448.02,note:"inclui parcelamento"},
  {id:"11",ref:"JUN/2026",kwh:341,dias:29,conta:336.72,note:"inclui parcelamento"},
];
if(!S.histAgua||!S.histAgua.length)S.histAgua=[
  {id:"a1",ref:"JUL/2025",m3:27,conta:417.75,note:"paga"},
  {id:"a2",ref:"AGO/2025",m3:25,conta:354.28,note:"paga"},
  {id:"a3",ref:"SET/2025",m3:22,conta:270.5,note:"paga"},
  {id:"a4",ref:"OUT/2025",m3:23,conta:298.76,note:"paga"},
  {id:"a5",ref:"NOV/2025",m3:22,conta:257.32,note:"paga"},
  {id:"a6",ref:"DEZ/2025",m3:25,conta:354.9,note:"paga"},
  {id:"a7",ref:"JAN/2026",m3:24,conta:335.21,note:"paga"},
  {id:"a8",ref:"FEV/2026",m3:18,conta:192.84,note:"paga"},
  {id:"a9",ref:"MAR/2026",m3:16,conta:183.9,note:"paga"},
  {id:"a10",ref:"ABR/2026",m3:19,conta:193.84,note:"paga — conta PDF"},
  {id:"a11",ref:"MAI/2026",m3:18,conta:184.16,note:"em atraso"},
  {id:"a12",ref:"JUN/2026",m3:18,conta:184.17,note:"em atraso — multa R$8,76"},
];

const save=()=>localStorage.setItem(KEY,JSON.stringify(S));

// Reset água diária à meia-noite
function resetAguaIfNewDay(){
  const today=new Date().toISOString().split('T')[0];
  if(S.agua.date!==today){S.agua={manha:0,tarde:0,noite:0,date:today};save();}
}

// ── TRAINING DATA ──
const DAYS=[
  {id:'seg',name:'Treino A',sub:'Costas · Bíceps · Ombro',day:'Segunda',exs:[
    {id:'s1',n:'Puxada supinada',s:'4×15/12/falha/10'},
    {id:'s2',n:'Remada máquina neutra',s:'3×8/10 · excêntrica'},
    {id:'s3',n:'Remada unilateral',s:'4×15+3×8/10'},
    {id:'s4',n:'Crucifixo inverso',s:'3×12'},
    {id:'s5',n:'Rosca direta',s:'3×8/10 · exc. 3s'},
    {id:'s6',n:'Rosca martelo',s:'3×6/8 · máximo'},
    {id:'s7',n:'Prancha abdominal',s:'3×1min'},
  ]},
  {id:'ter',name:'Treino B',sub:'Quadríceps · Glúteos',day:'Terça',exs:[
    {id:'t1',n:'Cadeira extensora',s:'1aq+2×8/10+falha c/ 2 drops'},
    {id:'t2',n:'Mesa flexora',s:'3×12 · excêntrica 3s'},
    {id:'t3',n:'Abdução de quadril',s:'4×falha · 8/10'},
    {id:'t4',n:'Agachamento hack',s:'3×8/10 pesadas'},
    {id:'t5',n:'Agachamento livre',s:'4×12/15 · amplitude máxima'},
  ]},
  {id:'qua',name:'Treino C',sub:'Peito · Tríceps · Ombro',day:'Quarta',exs:[
    {id:'q1',n:'Supino inclinado',s:'4×15/12/falha/10'},
    {id:'q2',n:'Cross over',s:'3×8/12'},
    {id:'q3',n:'Supino máquina neutra',s:'2×15/20 · carga máxima'},
    {id:'q4',n:'Tríceps polia',s:'carga alta até falha · 6/10'},
    {id:'q5',n:'Tríceps testa',s:'4×10/12 controladas'},
    {id:'q6',n:'Elevação lateral',s:'3×12/15 controladas'},
  ]},
  {id:'qui',name:'Treino D',sub:'Ombro · Bíceps · Tríceps',day:'Quinta',exs:[

// ── NAV ──
let curPage='hoje',curFisicoSub='academia',curCasaSub='visao';

function goTo(p){
  curPage=p;
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelectorAll('.nb').forEach(x=>x.classList.remove('active'));
  document.getElementById('nb-'+p).classList.add('active');
  document.getElementById('content').scrollTo(0,0);
  render(p);
}

// ── TODAY KEY ──
function todayKey(){return 'day_'+new Date().toISOString().split('T')[0];}
function weekKey(){const d=new Date();return d.getFullYear()+'-W'+Math.ceil(((d-new Date(d.getFullYear(),0,1))/86400000+new Date(d.getFullYear(),0,1).getDay()+1)/7);}

// ── RENDER ROUTER ──
function render(p){
  resetAguaIfNewDay();
  if(p==='hoje')renderHoje();
  else if(p==='fisico')renderFisico();
  else if(p==='casa')renderCasa();
  else if(p==='carro')renderCarro();
  else if(p==='tasks')renderTasks();
}

// ── DATE HELPERS ──
function fmtDate(){const d=new Date();return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}).replace('.','');}
function todayDow(){return DOW[new Date().getDay()];}
function todayDay(){return DAYS.find(x=>x.id===todayDow())||DAYS[0];}

// ── HOJE ──
function renderHoje(){
  const day=todayDay();
  const tk=todayKey();
  if(!S.checks[tk])S.checks[tk]={};
  const ch=S.checks[tk];
  const agua=S.agua;
  const aguaTotal=agua.manha+agua.tarde+agua.noite;
  const aguaPct=Math.min(Math.round(aguaTotal/3000*100),100);

  // Progress calc
  const habDone=HABITS.filter(h=>ch['h_'+h.id]).length;
  const gymDone=day.exs.filter(e=>ch[e.id]).length;
  const pct=Math.round((habDone+gymDone)/(HABITS.length+day.exs.length)*100)||0;
  const phys=day.exs.length?Math.round(gymDone/day.exs.length*100):0;

  // Tasks today
  const todayTasks=S.tasks.filter(t=>!t.done&&(!t.date||t.date<=new Date().toISOString().split('T')[0])).slice(0,3);

  // Last manut
  const lastOleo=S.manut.filter(m=>m.desc.toLowerCase().includes('óleo')||m.desc.toLowerCase().includes('oleo')).sort((a,b)=>b.id-a.id)[0];
  const curKm=S.manut.length?Math.max(...S.manut.map(m=>m.km||0)):0;

  document.getElementById('page-hoje').innerHTML=`
    <div class="hdr"><div class="hdr-title"><span class="hub">HUB</span> <span class="titan">TITAN</span></div><div class="hdr-r">${fmtDate()}</div></div>
    <div class="rings">
      ${ring(pct,'#FF6B35','Geral')}
      ${ring(phys,'#3dcc84','Físico')}
      ${ring(aguaPct,'#4da8f0','Água')}
    </div>
    <div class="c3">
      <div class="card" onclick="goTo('fisico')"><i class="ti ti-barbell" style="color:#FF6B35;"></i><div class="cv" style="color:#FF6B35;">${day.name}</div><div class="cl">${day.sub.split('·')[0].trim()}</div></div>
      <div class="card" onclick="goTo('tasks')"><i class="ti ti-list-check" style="color:#3dcc84;"></i><div class="cv" style="color:#3dcc84;">${S.tasks.filter(t=>!t.done).length} tasks</div><div class="cl">pendentes</div></div>
      <div class="card" onclick="goTo('carro')"><i class="ti ti-car" style="color:#9b7fe8;"></i><div class="cv">${curKm?curKm.toLocaleString('pt-BR'):'—'}</div><div class="cl">km</div></div>
    </div>
    <div class="sec">Hábitos</div>
    <div class="tasks">
      ${HABITS.map(h=>`<div class="task" onclick="toggleHabit('${h.id}')"><div class="tcb${ch['h_'+h.id]?' done':''}"></div><div class="ttx${ch['h_'+h.id]?' done':''}"><i class="ti ${h.icon}" style="margin-right:6px;"></i>${h.label}</div></div>`).join('')}
    </div>
    <div class="sec">Tarefas pendentes</div>
    <div class="tasks">
      ${todayTasks.length?todayTasks.map(t=>`<div class="task" onclick="toggleTask(${t.id})"><div class="tcb"></div><div class="ttx">${t.desc}</div><div class="ttag t${t.cat[0]}">${t.cat}</div></div>`).join(''):'<div class="empty">Sem tarefas. <span style="color:var(--orange);cursor:pointer;" onclick="openModal(\'task\')">Adicionar</span></div>'}
    </div>
    <div class="wbar">
      <div class="wh"><div class="wt">Água</div><div class="wv">${(aguaTotal/1000).toFixed(1)}L / 3L</div></div>
      <div class="wtr"><div class="wf" style="width:${aguaPct}%;"></div></div>
      <div class="wsubs">
        <div class="ws" onclick="openAguaModal('manha')"><span class="wsn">${(agua.manha/1000).toFixed(1)}L</span><span class="wsl">Manhã</span></div>
        <div class="ws" onclick="openAguaModal('tarde')"><span class="wsn">${(agua.tarde/1000).toFixed(1)}L</span><span class="wsl">Tarde</span></div>
        <div class="ws" onclick="openAguaModal('noite')"><span class="wsn">${(agua.noite/1000).toFixed(1)}L</span><span class="wsl">Noite</span></div>
      </div>
    </div>`;
}

function ring(pct,color,label){
  const r=22,c=2*Math.PI*r,off=c*(1-pct/100);
  return`<div class="rw"><svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="${r}" fill="none" stroke="#141414" stroke-width="6"/><circle cx="28" cy="28" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 28 28)"/><text x="28" y="28" class="rn">${pct}%</text></svg><div class="rl">${label}</div></div>`;
}

function toggleHabit(id){const tk=todayKey();if(!S.checks[tk])S.checks[tk]={};S.checks[tk]['h_'+id]=!S.checks[tk]['h_'+id];save();renderHoje();}

    if(S.boxeLog&&S.boxeLog.length){
      body+=`<div class="hrows">`;
      S.boxeLog.slice(0,5).forEach(b=>{const d=new Date(b.date+'T12:00:00');body+=`<div class="hrow"><div class="hric" style="background:rgba(155,127,232,.08);"><i class="ti ti-boxing-glove" style="color:var(--purple-d);font-size:14px;"></i></div><div style="flex:1;"><div class="hrnm">${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})} · ${b.min}min</div>${b.notes?`<div class="hrvl">${b.notes}</div>`:''}</div></div>`;});
      body+=`</div>`;
    }
  }

  document.getElementById('page-fisico').innerHTML=stabs+body;
  // Set today date
  const jd=document.getElementById('j-date');if(jd)jd.value=new Date().toISOString().split('T')[0];
  const bd=document.getElementById('bx-date');if(bd)bd.value=new Date().toISOString().split('T')[0];
}

function setFisicoSub(s){curFisicoSub=s;renderFisico();}
function toggleEx(id){const tk=todayKey();if(!S.checks[tk])S.checks[tk]={};S.checks[tk][id]=!S.checks[tk][id];save();renderFisico();}
function toggleFunc(i){const tk=todayKey();if(!S.checks[tk])S.checks[tk]={};S.checks[tk]['f'+i]=!S.checks[tk]['f'+i];save();renderFisico();}
function advFisio(){S.fisioPhase=Math.min((S.fisioPhase||0)+1,2);save();renderFisico();toast('Fase de fisio concluída!');}
function logFisio(s){if(!S.fisioLog)S.fisioLog=[];S.fisioLog.unshift({id:Date.now(),date:new Date().toISOString().split('T')[0],status:s});save();renderFisico();toast(s==='feito'?'Fisio registrada!':'Sessão pulada.');}
function saveJogo(){
  if(!S.matches)S.matches=[];
  S.matches.unshift({id:Date.now(),date:document.getElementById('j-date').value||new Date().toISOString().split('T')[0],teams:parseInt(document.getElementById('j-teams').value)||4,games:parseInt(document.getElementById('j-games').value)||4,scored:parseInt(document.getElementById('j-scored').value)||0,sofridos:parseInt(document.getElementById('j-sofridos').value)||0,rating:parseFloat(document.getElementById('j-rating').value)||6,notes:document.getElementById('j-notes').value});
  save();renderFisico();toast('Sessão de jogo salva!');
}
function saveBoxe(){
  if(!S.boxeLog)S.boxeLog=[];
  S.boxeLog.unshift({id:Date.now(),date:document.getElementById('bx-date').value||new Date().toISOString().split('T')[0],min:parseInt(document.getElementById('bx-min').value)||15,notes:document.getElementById('bx-notes').value});
  save();renderFisico();toast('Treino de combate salvo!');
}

// ── CASA ──
function renderCasa(){
  const sub=curCasaSub;
  const stabs=`<div class="stabs">
    <button class="stab${sub==='visao'?' active':''}" onclick="setCasaSub('visao')">Visão</button>
    <button class="stab${sub==='energia'?' active':''}" onclick="setCasaSub('energia')">Energia</button>
    <button class="stab${sub==='agua'?' active':''}" onclick="setCasaSub('agua')">Água</button>
    <button class="stab${sub==='tarefas'?' active':''}" onclick="setCasaSub('tarefas')">Tarefas</button>
  </div>`;

  let body='';

  if(sub==='visao'){
    const ult=S.histMensal[S.histMensal.length-1]||{};
    const ultA=S.histAgua[S.histAgua.length-1]||{};
    const atrasadas=S.histAgua.filter(x=>x.note&&x.note.includes('atraso'));
    if(atrasadas.length){body+=`<div class="alert-r"><i class="ti ti-alert-triangle"></i>${atrasadas.length} conta(s) em atraso — verificar</div>`;}
    body+=`<div class="sec">Última fatura</div><div class="hrows">`;
    body+=`<div class="hrow"><div class="hric" style="background:rgba(240,192,64,.08);"><i class="ti ti-bolt" style="color:var(--gold-d);"></i></div><div style="flex:1;"><div class="hrnm">Energia · ${ult.ref||'—'}</div><div class="hrvl">${ult.kwh||0} kWh · ${ult.dias||0} dias${ult.note?' · '+ult.note:''}</div></div><div class="hrst" style="color:var(--gold-d);">R$${(ult.conta||0).toFixed(0)}</div></div>`;
    body+=`<div class="hrow"><div class="hric" style="background:rgba(77,168,240,.08);"><i class="ti ti-droplet" style="color:var(--blue-d);"></i></div><div style="flex:1;"><div class="hrnm">Água · ${ultA.ref||'—'}</div><div class="hrvl">${ultA.m3||0} m³${ultA.note?' · '+ultA.note:''}</div></div><div class="hrst" style="color:var(--blue-d);">R$${(ultA.conta||0).toFixed(0)}</div></div>`;
    body+=`</div>`;
    // Tarefas casa
    const ct=S.casaTasks.filter(t=>!t.done).slice(0,3);
    body+=`<div class="sec">Tarefas da casa</div>`;
    if(ct.length){body+=`<div class="tasks">${ct.map(t=>`<div class="task" onclick="toggleCasaTask(${t.id})"><div class="tcb"></div><div class="ttx">${t.desc}</div>${t.date?`<div class="ttag tw">${t.date.split('-').slice(1).join('/')}</div>`:''}</div>`).join('')}</div>`;}
    else{body+=`<div class="empty">Sem tarefas pendentes.</div>`;}
    body+=`<div class="add-btn" onclick="openModal('casa')"><i class="ti ti-plus"></i> Registrar leitura ou tarefa</div>`;
  }

  else if(sub==='energia'){
    const total=S.histMensal.reduce((s,m)=>s+m.conta,0);
    const avg=S.histMensal.length?total/S.histMensal.length:0;
    body+=`<div class="c3" style="margin-bottom:14px;">
      <div class="card"><i class="ti ti-bolt" style="color:var(--gold-d);"></i><div class="cv">R$${avg.toFixed(0)}</div><div class="cl">média mensal</div></div>
      <div class="card"><i class="ti ti-bolt" style="color:var(--orange);"></i><div class="cv">${S.histMensal.length?Math.round(S.histMensal.reduce((s,m)=>s+m.kwh,0)/S.histMensal.length):0}</div><div class="cl">kWh médio</div></div>
      <div class="card"><i class="ti ti-calendar" style="color:var(--muted2);"></i><div class="cv">${S.histMensal.length}</div><div class="cl">meses</div></div>
    </div>`;
    body+=`<div class="sec">Histórico</div><div class="hrows">`;
    [...S.histMensal].reverse().forEach(m=>{body+=`<div class="hrow"><div style="width:56px;flex-shrink:0;"><div style="font-size:var(--f-xs);font-weight:700;color:var(--gold-d);">${m.ref}</div><div style="font-size:var(--f-xs);color:var(--muted2);">${m.kwh}kWh</div></div><div style="flex:1;"><div class="ptr" style="margin-top:4px;"><div class="pfl" style="width:${Math.min(m.kwh/938*100,100).toFixed(0)}%;background:var(--gold-d);"></div></div>${m.note?`<div style="font-size:var(--f-xs);color:var(--muted2);margin-top:2px;">${m.note}</div>`:''}</div><div class="hrst" style="color:var(--gold-d);">R$${m.conta.toFixed(0)}</div></div>`;});
    body+=`</div>`;
  }

  else if(sub==='agua'){
    const totalM3=S.histAgua.reduce((s,m)=>s+m.m3,0);
    const avgM3=S.histAgua.length?totalM3/S.histAgua.length:0;
    body+=`<div class="c3" style="margin-bottom:14px;">
      <div class="card"><i class="ti ti-droplet" style="color:var(--blue-d);"></i><div class="cv">${avgM3.toFixed(0)}</div><div class="cl">m³ médio</div></div>
      <div class="card"><i class="ti ti-droplet" style="color:var(--blue);"></i><div class="cv">R$${S.histAgua.length?(S.histAgua.reduce((s,m)=>s+m.conta,0)/S.histAgua.length).toFixed(0):'—'}</div><div class="cl">média conta</div></div>
      <div class="card"><i class="ti ti-calendar" style="color:var(--muted2);"></i><div class="cv">${S.histAgua.length}</div><div class="cl">meses</div></div>
    </div>`;
    body+=`<div class="sec">Histórico</div><div class="hrows">`;
    [...S.histAgua].reverse().forEach(m=>{const atrasado=m.note&&m.note.includes('atraso');body+=`<div class="hrow"><div style="width:56px;flex-shrink:0;"><div style="font-size:var(--f-xs);font-weight:700;color:${atrasado?'var(--red-d)':'var(--blue-d)'};">${m.ref}</div><div style="font-size:var(--f-xs);color:var(--muted2);">${m.m3}m³</div></div><div style="flex:1;">${m.note?`<div style="font-size:var(--f-xs);color:${atrasado?'var(--red-d)':'var(--muted2)'};margin-top:4px;">${m.note}</div>`:''}</div><div class="hrst" style="color:${atrasado?'var(--red-d)':'var(--blue-d)'};">R$${m.conta.toFixed(0)}</div></div>`;});
    body+=`</div>`;
  }

  else if(sub==='tarefas'){
    const pendentes=S.casaTasks.filter(t=>!t.done);
    const feitas=S.casaTasks.filter(t=>t.done).slice(0,5);
    body+=`<div class="add-btn" onclick="openModal('casa')"><i class="ti ti-plus"></i> Nova tarefa ou leitura</div>`;
    body+=`<div class="sec">Pendentes · ${pendentes.length}</div>`;
    if(pendentes.length){body+=`<div class="tasks">${pendentes.map(t=>`<div class="task" onclick="toggleCasaTask(${t.id})"><div class="tcb"></div><div class="ttx">${t.desc}</div>${t.date?`<div class="ttag tw">${t.date.split('-').slice(1).join('/')}</div>`:''}</div>`).join('')}</div>`;}
    else{body+=`<div class="empty">Sem tarefas pendentes.</div>`;}
    if(feitas.length){body+=`<div class="sec">Concluídas</div><div class="tasks">${feitas.map(t=>`<div class="task"><div class="tcb done"></div><div class="ttx done">${t.desc}</div></div>`).join('')}</div>`;}
  }

  document.getElementById('page-casa').innerHTML=stabs+body;
}

function setCasaSub(s){curCasaSub=s;renderCasa();}
function toggleCasaTask(id){const t=S.casaTasks.find(x=>x.id===id);if(t){t.done=!t.done;save();renderCasa();}}
function saveCasa(){
  const tipo=document.getElementById('casa-tipo').value;
  const desc=document.getElementById('casa-desc').value;
  const date=document.getElementById('casa-date').value;
  if(!desc){toast('Preencha a descrição.');return;}
  S.casaTasks.push({id:Date.now(),tipo,desc,date,done:false});
  save();closeModal('casa');renderCasa();toast('Registrado!');
}

// ── CARRO ──
function renderCarro(){
  const ms=S.manut||[];
  const lastOleo=ms.filter(m=>(m.desc||'').toLowerCase().includes('óleo')||(m.desc||'').toLowerCase().includes('oleo')).sort((a,b)=>b.id-a.id)[0];
  const curKm=ms.length?Math.max(...ms.map(m=>m.km||0)):0;
  const proxTroca=lastOleo?(lastOleo.km||0)+10000:null;
  const faltam=proxTroca?proxTroca-curKm:null;

  let body='';
  body+=`<div class="hdr"><div class="hdr-title" style="font-size:var(--f-lg);color:var(--text);">Carro</div><div class="hdr-r">${curKm?curKm.toLocaleString('pt-BR')+' km':'—'}</div></div>`;
  body+=`<div class="c3">
    <div class="card"><i class="ti ti-gauge" style="color:var(--purple-d);"></i><div class="cv">${curKm?curKm.toLocaleString('pt-BR'):'—'}</div><div class="cl">km atual</div></div>
    <div class="card"><i class="ti ti-engine" style="color:${faltam&&faltam<2000?'var(--red-d)':faltam&&faltam<5000?'var(--gold-d)':'var(--green-d)'};"></i><div class="cv" style="color:${faltam&&faltam<2000?'var(--red-d)':faltam&&faltam<5000?'var(--gold-d)':'var(--green-d)'};">${faltam!=null?faltam.toLocaleString('pt-BR'):'—'}</div><div class="cl">p/ troca óleo</div></div>
    <div class="card"><i class="ti ti-list" style="color:var(--muted2);"></i><div class="cv">${ms.length}</div><div class="cl">registros</div></div>
  </div>`;

  if(faltam!=null&&faltam<3000){body+=`<div class="alert-b"><i class="ti ti-alert-triangle"></i>Troca de óleo em ${faltam.toLocaleString('pt-BR')} km</div>`;}

  body+=`<div class="add-btn" onclick="openModal('manut')"><i class="ti ti-plus"></i> Registrar manutenção</div>`;

  body+=`<div class="sec">Histórico</div>`;
  if(ms.length){
    body+=`<div class="hrows">`;
    [...ms].sort((a,b)=>b.id-a.id).forEach(m=>{
      const d=new Date(m.date+'T12:00:00');
      const isOleo=(m.desc||'').toLowerCase().includes('óleo')||(m.desc||'').toLowerCase().includes('oleo');
      body+=`<div class="hrow"><div class="hric" style="background:${isOleo?'rgba(61,204,132,.08)':'rgba(155,127,232,.08)'};"><i class="ti ${isOleo?'ti-oil':'ti-tool'}" style="color:${isOleo?'var(--green-d)':'var(--purple-d)'};font-size:14px;"></i></div><div style="flex:1;"><div class="hrnm">${m.desc}</div><div class="hrvl">${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'2-digit'})} · ${m.km?m.km.toLocaleString('pt-BR')+' km':'km não informado'}${m.note?' · '+m.note:''}</div></div></div>`;
    });
    body+=`</div>`;
  }else{body+=`<div class="empty">Nenhuma manutenção registrada.<br>Adicione a troca de óleo mais recente.</div>`;}

  document.getElementById('page-carro').innerHTML=body;
}

// ── TASKS ──
function renderTasks(){
  const sub=S.tasksSub||'todas';
  const cats={work:'Trabalho',casa:'Casa',pessoal:'Pessoal',saude:'Saúde',carro:'Carro'};
  const tagClass={work:'tw',casa:'tc',pessoal:'ts',saude:'ts',carro:'tr'};

  const stabs=`<div class="stabs">
    <button class="stab${sub==='todas'?' active':''}" onclick="setTasksSub('todas')">Todas</button>
    <button class="stab${sub==='work'?' active':''}" onclick="setTasksSub('work')">Trabalho</button>
    <button class="stab${sub==='casa'?' active':''}" onclick="setTasksSub('casa')">Casa</button>
    <button class="stab${sub==='pessoal'?' active':''}" onclick="setTasksSub('pessoal')">Pessoal</button>
  </div>`;

  let allTasks=S.tasks||[];
  if(sub!=='todas')allTasks=allTasks.filter(t=>t.cat===sub);
  const pendentes=allTasks.filter(t=>!t.done);
  const feitas=allTasks.filter(t=>t.done).slice(0,5);

  const inputArea=`<div class="input-area">
    <div class="input-lbl">Nova tarefa</div>
    <input class="fi" id="task-desc" placeholder="Descrição...">
    <div class="irow">
      <select class="fi" id="task-cat">
        <option value="work">Trabalho</option>
        <option value="casa">Casa</option>
        <option value="pessoal">Pessoal</option>
        <option value="saude">Saúde</option>
        <option value="carro">Carro</option>
      </select>
      <input type="date" class="fi" id="task-date">
      <button class="ibtn" onclick="saveTask()">Add</button>
    </div>
  </div>`;

  let body=inputArea;
  body+=`<div class="sec">Pendentes · ${pendentes.length}</div>`;
  if(pendentes.length){
    body+=`<div class="tasks">${pendentes.map(t=>`<div class="task" onclick="toggleTask(${t.id})"><div class="tcb"></div><div class="ttx">${t.desc}</div><div class="ttag ${tagClass[t.cat]||'tw'}">${cats[t.cat]||t.cat}</div></div>`).join('')}</div>`;
  }else{body+=`<div class="empty">Sem tarefas pendentes.</div>`;}

  if(feitas.length){
    body+=`<div class="sec">Concluídas</div><div class="tasks">${feitas.map(t=>`<div class="task" onclick="toggleTask(${t.id})"><div class="tcb done"></div><div class="ttx done">${t.desc}</div><div class="ttag ${tagClass[t.cat]||'tw'}">${cats[t.cat]||t.cat}</div></div>`).join('')}</div>`;
  }

  document.getElementById('page-tasks').innerHTML=stabs+body;
  const td=document.getElementById('task-date');if(td)td.value=new Date().toISOString().split('T')[0];
}

function setTasksSub(s){S.tasksSub=s;save();renderTasks();}
function saveTask(){
  const desc=document.getElementById('task-desc').value.trim();
  if(!desc){toast('Digite a descrição.');return;}
  if(!S.tasks)S.tasks=[];
  S.tasks.unshift({id:Date.now(),desc,cat:document.getElementById('task-cat').value||'work',date:document.getElementById('task-date').value,done:false});
  save();
  closeModal('task');
  renderTasks();
  if(curPage==='hoje')renderHoje();
  toast('Tarefa adicionada!');
}
function toggleTask(id){const t=(S.tasks||[]).find(x=>x.id===id);if(t){t.done=!t.done;save();renderTasks();if(curPage==='hoje')renderHoje();}}

// ── MODAL ──
function openModal(id){document.getElementById('modal-'+id).classList.add('open');}
function closeModal(id){document.getElementById('modal-'+id).classList.remove('open');}
// Close on bg click
document.querySelectorAll('.modal-bg').forEach(m=>{m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');});});

// ── MANUT ──
function saveManut(){
  const desc=document.getElementById('manut-desc').value.trim();
  const km=parseInt(document.getElementById('manut-km').value)||0;
  const date=document.getElementById('manut-date').value||new Date().toISOString().split('T')[0];
  if(!desc){toast('Digite a descrição.');return;}
  if(!S.manut)S.manut=[];
  S.manut.push({id:Date.now(),desc,km,date,note:document.getElementById('manut-note').value});
  save();closeModal('manut');renderCarro();toast('Manutenção registrada!');
}

// ── TOAST ──
let tt;
function toast(msg){const t=document.getElementById('toast');document.getElementById('tm').textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2500);}

// ── INIT ──
const md=document.getElementById('manut-date');if(md)md.value=new Date().toISOString().split('T')[0];
render('hoje');
</script>
</body>
</html>
